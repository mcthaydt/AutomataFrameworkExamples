# One replay hash must come out the same in Node, Chromium, WebKit and Firefox. `plan` says how much this run tests;
# `check` runs the static checks and the Node tests; `browsers` runs the parity and browser tests and the journeys, each
# browser in two shards side by side; `engines` names each browser's result, so a failing engine is named by its check.
# Every action is pinned to a commit. Nothing is packed or published from this repo.
#
# How much is tested (the Owner, 2026-11-15): while a pull request is a draft, a thread is still working on it, so only
# what its change reaches runs, and a run stops at its first failure. The whole suite runs once the pull request is
# ready for review, on every push to main, and on a draft that carries the `full-tests` label.
name: ci

on:
  pull_request:
    # `ready_for_review` starts the whole suite as a draft is handed over; `labeled` lets a thread ask for it sooner.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push stops the run it replaces, so no one waits on results that no longer count.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # How much this run tests, from the event and the files the pull request changes. Everything is `true` except on a
  # draft without the `full-tests` label whose change leaves the build and the test setup alone:
  #   full      false: a run stops at its first failure; the recorded plays are still played in every engine
  #   journeys  false when nothing the built page is made of changed; otherwise a draft plays them in Chromium only
  #   pictures  false when nothing that is seen changed (a `.css` file, the words, the page, the art), so the pictures
  #             journey is left out; the `pictures` label asks for it
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      journeys: ${{ steps.plan.outputs.journeys }}
      pictures: ${{ steps.plan.outputs.pictures }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          full=true journeys=true pictures=true
          if [ "$EVENT" = pull_request ] && [ "$DRAFT" = true ] && [[ " $LABELS " != *" full-tests "* ]] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"; then
            printf 'This draft changes:\n%s\n' "$changed"
            # A change to how things are installed, built or tested reaches every test.
            if ! grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|[^/]*\.config\.(ts|js)|tsconfig[^/]*\.json|\.github/)' <<<"$changed"; then
              full=false
              grep -qE '^(src/|content/|replays/|automata\.toml|index\.html|public/|scripts/|tests/journeys/|tests/fixtures/)' <<<"$changed" || journeys=false
              grep -qE '\.css$|^(content/|src/features/play/|index\.html|public/|tests/journeys/pictures)' <<<"$changed" || pictures=false
            fi
          fi
          if [[ " $LABELS " == *" pictures "* ]]; then pictures=true; fi
          echo "full=$full journeys=$journeys pictures=$pictures"
          { echo "full=$full"; echo "journeys=$journeys"; echo "pictures=$pictures"; } >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:node

  # Each browser in two shards that run side by side (the Owner, 2026-11-15). The parity tests and the recorded plays
  # are short and run whole in the first shard; the journeys are split between the two.
  browsers:
    needs: plan
    name: browsers (${{ matrix.engine }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # On a draft the first failure stops the other shards too; the whole suite lets every shard finish.
      fail-fast: ${{ needs.plan.outputs.full != 'true' }}
      matrix:
        engine: [chromium, webkit, firefox]
        shard: [1, 2]
    env:
      BAIL: ${{ needs.plan.outputs.full == 'true' && '0' || '1' }}
      EXCLUDE: ${{ needs.plan.outputs.pictures != 'true' && '--exclude=tests/journeys/pictures.journey.test.ts' || '' }}
      JOURNEYS: ${{ needs.plan.outputs.journeys == 'true' && (needs.plan.outputs.full == 'true' || matrix.engine == 'chromium') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs, by Playwright's version; the system libraries it needs are put in each time.
      - id: version
        run: echo "playwright=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-${{ matrix.engine }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.engine }}
      - run: pnpm test:engine ${{ matrix.engine }}
        if: matrix.shard == 1
      # The browser just saved where it ended in `.hashes/`. Node plays the same recording here, so the two can be
      # compared; three browsers each equal to Node is all four engines the same.
      - run: pnpm vitest run --project node tests/replay
        if: matrix.shard == 1
      - run: pnpm same-hash node ${{ matrix.engine }}
        if: matrix.shard == 1
      # The built page, driven by this engine from outside, end to end.
      - run: pnpm build
        if: env.JOURNEYS == 'true'
      - run: pnpm test:journeys --shard=${{ matrix.shard }}/2 --bail=$BAIL $EXCLUDE
        if: env.JOURNEYS == 'true'
        env:
          ENGINE: ${{ matrix.engine }}
      # Pictures a person looks at (the drunk-grandma check); nothing compares them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/**/__screenshots__/**
          if-no-files-found: ignore

  # One check per browser, `engines (<browser>)`, green only when both of that browser's shards passed, so the names
  # main's protection asks for stay as they were.
  engines:
    needs: browsers
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Both shards of ${{ matrix.engine }} passed
        run: |
          set -euo pipefail
          results="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --attempt "$GITHUB_RUN_ATTEMPT" --json jobs \
            --jq '.jobs[] | select(.name | startswith("browsers (${{ matrix.engine }} ")) | "\(.name): \(.conclusion)"')"
          echo "$results"
          [ "$(grep -c ': success$' <<<"$results")" -eq 2 ]
