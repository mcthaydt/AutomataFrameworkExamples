# One replay hash must come out the same in Node, Chromium, WebKit and Firefox. `plan` says how much this run tests;
# `check` runs the static checks and the Node tests; `browsers` runs the parity and browser tests and the journeys, each
# browser in six shards side by side (18 jobs in a full run); `engines` names each browser's result, so a failing engine is named by its check.
# Every action is pinned to a commit. Nothing is packed or published from this repo.
#
# How much is tested (the Owner, 2026-11-15): while a pull request is a draft, a thread is still working on it, so only
# what its change reaches runs, and a run stops at its first failure. The whole suite runs once the pull request is
# ready for review, on every push to main, and on a draft that carries the `full-tests` label. A draft also runs in
# Chromium only (the Owner, 2026-11-16): WebKit and Firefox, and so the proof that every engine plays the same, run in
# the full run that gates merge.
name: ci

on:
  pull_request:
    # `ready_for_review` starts the whole suite as a draft is handed over; `labeled` lets a thread ask for it sooner.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push stops the run it replaces, so no one waits on results that no longer count.
concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled, so every merge gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # How much this run tests, from the event and the files the pull request changes. Everything but `docs` is `true`
  # except on a draft without the `full-tests` label whose change leaves the build and the test setup alone:
  #   full      false: a run stops at its first failure
  #   engines   the browsers the shards run in: Chromium only on a draft, all three otherwise
  #   journeys  false when nothing the built page is made of changed; otherwise a draft plays them in Chromium only
  #   pictures  false when nothing that is seen changed (a `.css` file, the words, the page, the art), so the pictures
  #             journey is left out; the `screenshots` label (or the older `pictures`) asks for it
  #   docs      true when only Markdown that people read changed: `docs` passes every check main requires,
  #             under its own name, and every job that tests is left out
  #   quick     `quick ` on a draft, `skipped ` on a docs-only run, and empty otherwise: the start of every
  #             check's name, so a quick run never has the name of a check main requires, and only a full run (or
  #             `docs`) can let a pull request merge
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      engines: ${{ steps.plan.outputs.engines }}
      journeys: ${{ steps.plan.outputs.journeys }}
      pictures: ${{ steps.plan.outputs.pictures }}
      docs: ${{ steps.plan.outputs.docs }}
      quick: ${{ steps.plan.outputs.docs == 'true' && 'skipped ' || steps.plan.outputs.full != 'true' && 'quick ' || '' }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          full=true journeys=true pictures=true docs=false
          engines='["chromium","webkit","firefox"]'
          if [ "$EVENT" = pull_request ] && [[ " $LABELS " != *" full-tests "* ]] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" && [ -n "$changed" ]; then
            printf 'This pull request changes:\n%s\n' "$changed"
            # Only Markdown that people read (CLAUDE.md and the notes under docs/, never the README or a page a test
            # reads): there is nothing to test, so `docs` passes every check main requires at once, draft or not.
            others="$(grep -vE '^(CLAUDE\.md|docs/.+\.md)$' <<<"$changed" || true)"
            if [ -z "$others" ]; then
              docs=true
            # A change to how things are installed, built or tested, or to the shared test files, reaches every test.
            elif [ "$DRAFT" = true ] && ! grep -qE '^(tests/fixtures/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|[^/]*\.config\.(ts|js)|tsconfig[^/]*\.json|\.github/)' <<<"$changed"; then
              full=false engines='["chromium"]'
              grep -qE '^(src/|content/|replays/|automata\.toml|index\.html|public/|scripts/|tests/journeys/)' <<<"$changed" || journeys=false
              grep -qE '\.css$|^(content/|src/features/play/|index\.html|public/|tests/journeys/pictures)' <<<"$changed" || pictures=false
            fi
          fi
          if [[ " $LABELS " == *" screenshots "* || " $LABELS " == *" pictures "* ]]; then pictures=true; fi
          echo "docs=$docs full=$full engines=$engines journeys=$journeys pictures=$pictures"
          { echo "docs=$docs"; echo "full=$full"; echo "engines=$engines"; echo "journeys=$journeys"; echo "pictures=$pictures"; } >> "$GITHUB_OUTPUT"

  # A pull request that changes only Markdown that people read has nothing to test (the Owner, 2026-11-15). This job
  # stands in for every check main requires, under its exact name, and passes at once. Every job that tests is left out
  # and has `skipped ` at the start of its name, so a skipped job never wears a required name, and on any other run this
  # job's own names start with `docs only `.
  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    name: ${{ needs.plan.outputs.docs == 'true' && matrix.check || format('docs only {0}', matrix.check) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - 'check'
          - 'engines (chromium)'
          - 'engines (webkit)'
          - 'engines (firefox)'
    env:
      CHECK: ${{ matrix.check }}
    steps:
      - run: echo "Only Markdown that people read changed, so there is nothing to test, and $CHECK passes."

  check:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}check
    runs-on: ubuntu-latest
    env:
      # On a draft: the Node tests the change reaches, stopping at the first failure.
      ONLY: ${{ needs.plan.outputs.full != 'true' && '--changed=origin/main --bail=1 --passWithNoTests' || '' }}
    steps:
      # The whole history, so `--changed` can compare with `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test:node $ONLY

  # Each browser in six shards that run side by side, so a full run is 18 jobs (the Owner, 2026-11-16). A draft runs
  # Chromium only: the `engines` list comes from `plan`. The parity tests and the recorded plays are short and run whole
  # in the first shard, as the proof that every engine plays the same (every engine, in the full run); the journeys are
  # split between the six. The journeys drive the built page, which Vitest's `--changed` cannot trace
  # back to the files it is made of, so `plan` decides from the paths whether they run.
  browsers:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: browsers (${{ matrix.engine }} ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      # On a draft the first failure stops the other shards too; the whole suite lets every shard finish.
      fail-fast: ${{ needs.plan.outputs.full != 'true' }}
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
        shard: [1, 2, 3, 4, 5, 6]
    env:
      BAIL: ${{ needs.plan.outputs.full == 'true' && '0' || '1' }}
      EXCLUDE: ${{ needs.plan.outputs.pictures != 'true' && '--exclude=tests/journeys/pictures.journey.test.ts' || '' }}
      JOURNEYS: ${{ needs.plan.outputs.journeys == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs, by Playwright's version; the system libraries it needs are put in each time.
      - id: version
        run: echo "playwright=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.version.outputs.playwright }}-${{ matrix.engine }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ matrix.engine }}
      - run: pnpm test:engine ${{ matrix.engine }}
        if: matrix.shard == 1
      # The browser just saved where it ended in `.hashes/`. Node plays the same recording here, so the two can be
      # compared; three browsers each equal to Node is all four engines the same.
      - run: pnpm vitest run --project node tests/replay
        if: matrix.shard == 1
      - run: pnpm same-hash node ${{ matrix.engine }}
        if: matrix.shard == 1
      # The built page, driven by this engine from outside, end to end.
      - run: pnpm build
        if: env.JOURNEYS == 'true'
      - run: pnpm test:journeys --shard=${{ matrix.shard }}/6 --bail=$BAIL $EXCLUDE
        if: env.JOURNEYS == 'true'
        env:
          ENGINE: ${{ matrix.engine }}
      # Pictures a person looks at (the drunk-grandma check); nothing compares them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screens-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/**/__screenshots__/**
          if-no-files-found: ignore

  # One check per browser, `engines (<browser>)`, green only when all six of that browser's shards passed, so the names
  # main's protection asks for stay as they were. A draft has only Chromium's.
  engines:
    needs: [plan, browsers]
    name: ${{ needs.plan.outputs.quick }}engines (${{ matrix.engine }})
    # Also on a run a newer one cancelled, so that run shows red: a skipped check would count as passed.
    if: always() && needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # The script asks again after a GitHub 5xx and reads each shard from the newest attempt that ran it, so a re-run
      # of one job can pass (see `scripts/engines-gate.ts`).
      - name: Every shard of ${{ matrix.engine }} passed
        run: node scripts/engines-gate.ts
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}

  # The one aggregate check main requires beside the names above. `plan` decides which checks apply to this run; this
  # passes only when each of those ran and passed and every other was left out by `plan`, so a job skipped because
  # something before it failed or was cancelled never counts as passed. A draft's is `quick gate`, which main never
  # requires, so only a full run (or a docs-only one) can let a pull request merge. A new job is added to both lists.
  gate:
    needs: [plan, docs, check, browsers, engines]
    if: always()
    name: ${{ needs.plan.outputs.quick == 'quick ' && 'quick ' || '' }}gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that applies ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          GATE: |
            const results = JSON.parse(process.env.RESULTS)
            const applies = JSON.parse(process.env.APPLIES)
            let ok = true
            for (const [job, want] of Object.entries(applies)) {
              const got = results[job]?.result
              const good = want ? got === 'success' : got === 'skipped'
              console.log(`${good ? 'ok ' : 'NO '} ${job}: ${want ? 'applies' : 'not applicable'}, ${got}`)
              ok &&= good
            }
            for (const job of Object.keys(results)) {
              if (!(job in applies)) {
                console.log(`NO  ${job}: the gate does not know this job`)
                ok = false
              }
            }
            process.exit(ok ? 0 : 1)
          APPLIES: >-
            {"plan": true, "docs": ${{ needs.plan.outputs.docs == 'true' }}, "check": ${{ needs.plan.outputs.docs != 'true' }}, "browsers": ${{ needs.plan.outputs.docs != 'true' }}, "engines": ${{ needs.plan.outputs.docs != 'true' }}}
        run: |
          node --input-type=module -e "$GATE"
        shell: bash
